# Dependabot Configuration
# Automatically scans dependencies and creates PRs for security updates
version: 2
updates:
  # Backend: PHP Composer dependencies
  - package-ecosystem: "composer"
    directory: "/pteas-yeung-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
      - "backend"

  # Frontend: Node / NPM dependencies
  - package-ecosystem: "npm"
    directory: "/pteas-yeung-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
      - "frontend"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "security"
      - "ci-cd"
