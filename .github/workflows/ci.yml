name: CI - Test & Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # 1. Backend CI: Laravel 13 & PHP 8.3
  # ========================================================
  backend-ci:
    name: Backend (PHP 8.3 / Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pteas-yeung-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, pdo_sqlite, bcmath, gd, zip, curl
          coverage: none
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: pteas-yeung-api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('pteas-yeung-api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing
        run: php artisan test

  # ========================================================
  # 2. Frontend CI: Next.js 16 & Node 20
  # ========================================================
  frontend-ci:
    name: Frontend (Next.js 16 / Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pteas-yeung-ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pteas-yeung-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
          NEXT_PUBLIC_STORAGE_URL: "http://localhost:8000/storage"
