name: Security & Vulnerability Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  # 1. Gitleaks Secret Scanner: Detect accidental commits of passwords, tokens, API keys
  gitleaks:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # 2. Backend Security Audit: PHP Composer CVE & Vulnerability Scan
  backend-audit:
    name: Backend Dependency Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pteas-yeung-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Run Composer Security Audit
        run: composer audit --format=plain
        continue-on-error: true

  # 3. Frontend Security Audit: NPM Advisory Vulnerability Scan
  frontend-audit:
    name: Frontend Dependency Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pteas-yeung-ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true
