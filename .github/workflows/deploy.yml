name: CD - Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ========================================================
  # 1. Pre-deployment CI checks validation
  # ========================================================
  pre-deploy-check:
    name: Verify Tests & Build
    uses: ./.github/workflows/ci.yml

  # ========================================================
  # 2. Deploy to Production Server via SSH
  # ========================================================
  deploy:
    name: Deploy via SSH & Docker
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment on server..."
            cd ${{ secrets.DEPLOY_PATH || '/var/www/pteas-yeung' }}

            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main

            # Ensure deployment script has executable permissions
            chmod +x deploy.sh

            # Execute production deployment script
            ./deploy.sh

            echo "✅ Deployment completed successfully!"
