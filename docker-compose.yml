version: '3.8'

services:
  # ========================================================
  # 1. Reverse Proxy Gateway (Port 80 / 443)
  # ========================================================
  gateway:
    image: nginx:alpine
    container_name: pteas_gateway
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui
    networks:
      - pteas_network

  # ========================================================
  # 2. Frontend: Next.js 16 (Port 3000 internal)
  # ========================================================
  ui:
    build:
      context: ./pteas-yeung-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-/storage}
    container_name: pteas_ui
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    networks:
      - pteas_network

  # ========================================================
  # 3. Backend: Laravel 13 API (PHP 8.3 FPM + Nginx)
  # ========================================================
  api:
    build:
      context: ./pteas-yeung-api
      dockerfile: Dockerfile
    container_name: pteas_api
    restart: unless-stopped
    environment:
      - APP_NAME=PteasYeung
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-pteas_yeung}
      - DB_USERNAME=${DB_USERNAME:-pteas_user}
      - DB_PASSWORD=${DB_PASSWORD:-pteas_password}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTO_MIGRATE=true
      - FILESYSTEM_DISK=${FILESYSTEM_DISK:-minio}
      - MINIO_KEY=${MINIO_KEY:-minioadmin}
      - MINIO_SECRET=${MINIO_SECRET:-minioadmin}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - MINIO_BUCKET=${MINIO_BUCKET:-pteas-yeung}
      - MINIO_ENDPOINT=http://room-minio:9000
      - MINIO_URL=${MINIO_URL:-http://localhost:9000/pteas-yeung}
      - MINIO_USE_PATH_STYLE_ENDPOINT=true
    volumes:
      - api_storage:/var/www/html/storage/app/public
      - api_backups:/var/www/html/storage/app/backups
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - pteas_network

  # ========================================================
  # 4. Database: PostgreSQL 16
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: pteas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pteas_yeung}
      POSTGRES_USER: ${DB_USERNAME:-pteas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pteas_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pteas_network

  # ========================================================
  # 5. Cache & Queue: Redis
  # ========================================================
  redis:
    image: redis:alpine
    container_name: pteas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - pteas_network

  # ========================================================
  # 6. Object Storage: MinIO S3 (room-minio)
  # ========================================================
  minio:
    image: minio/minio:latest
    container_name: room-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - pteas_network

networks:
  pteas_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  api_storage:
    driver: local
  api_backups:
    driver: local
